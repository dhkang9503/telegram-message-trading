project:
  name: telegram-message-trading
  app_name: telegram-parser-training
  artifact_volume: telegram-parser-artifacts
  hf_cache_volume: telegram-parser-hf-cache

model:
  base_model_id: Qwen/Qwen3-0.6B
  max_length: 256
  system_prompt: >-
    너는 특정 BTCUSDT 리딩 채널의 한국어 메시지를 구조화된 거래 액션 JSON으로 변환하는 파서다. 메시지에 명시된 행동만 추출하고 추측하지 않는다. 출력은 actions 배열을 가진 JSON 하나만 반환한다.

reproducibility:
  seed: 43
  data_seed: 43
  llama_cpp_commit: 91d2fc387529940230555abd297a8b5e99737d3f
  package_versions:
    torch: "2.11.0"
    transformers: "4.51.3"
    tokenizers: "0.21.1"
    datasets: "3.5.0"
    peft: "0.15.2"
    accelerate: "1.6.0"
    huggingface_hub: "0.30.2"

training:
  # Feedback dataset revision: 2026-08-06-close-intent-2
  feedback_repeat: 4
  num_epochs: 5
  train_batch_size: 4
  eval_batch_size: 8
  gradient_accumulation_steps: 4
  learning_rate: 0.0001
  weight_decay: 0.01
  warmup_ratio: 0.1
  lr_scheduler_type: cosine
  max_grad_norm: 1.0
  save_steps: 50
  save_total_limit: 3
  logging_steps: 10
  lora:
    r: 16
    alpha: 32
    dropout: 0.05
    target_modules:
      - q_proj
      - k_proj
      - v_proj
      - o_proj
      - gate_proj
      - up_proj
      - down_proj

export:
  default_quant_types:
    - Q8_0
  keep_f16_gguf: false

evaluation:
  n_ctx: 512
  n_predict: 48
  temperature: 0.0
  top_k: 1
  top_p: 1.0
  repeat_penalty: 1.0
  server_port: 18080
  server_start_timeout_seconds: 120

baseline:
  deployed_q8:
    exact_match_rate: 0.9415384615
    open_to_close: 0
  release_gate:
    min_json_valid_rate: 1.0
    min_exact_match_rate: 0.935
    max_long_to_short: 0
    max_short_to_long: 0
    max_open_to_close: 0
    max_close_to_open: 0
