project:
  name: telegram-message-trading
  app_name: telegram-parser-training
  artifact_volume: telegram-parser-artifacts
  hf_cache_volume: telegram-parser-hf-cache

model:
  base_model_id: Qwen/Qwen3-0.6B
  max_length: 256
  system_prompt: >-
    너는 BTCUSDT 리딩 메시지를 actions JSON으로 변환한다. 모든 수신자가 지금 즉시 실행할 명확한 거래 지시만 추출한다. 선택·권고·조건·미래 계획이거나 특정 상태의 사람에게만 적용되면 actions는 빈 배열이다. OPEN_REENTRY의 side는 long, short 또는 null만 사용한다. 애매하면 actions는 빈 배열이다. JSON만 출력한다.

reproducibility:
  seed: 43
  data_seed: 43
  llama_cpp_commit: 91d2fc387529940230555abd297a8b5e99737d3f
  package_versions:
    torch: "2.11.0"
    transformers: "4.51.3"
    tokenizers: "0.21.1"
    datasets: "3.5.0"
    peft: "0.15.2"
    accelerate: "1.6.0"
    huggingface_hub: "0.30.2"

training:
  # Feedback dataset revision: 2026-08-06-close-intent-2-a100-runtime-normalization
  feedback_repeat: 4
  num_epochs: 5
  train_batch_size: 4
  eval_batch_size: 8
  gradient_accumulation_steps: 4
  learning_rate: 0.0001
  weight_decay: 0.01
  warmup_ratio: 0.1
  lr_scheduler_type: cosine
  max_grad_norm: 1.0
  save_steps: 50
  save_total_limit: 3
  logging_steps: 10
  lora:
    r: 16
    alpha: 32
    dropout: 0.05
    target_modules:
      - q_proj
      - k_proj
      - v_proj
      - o_proj
      - gate_proj
      - up_proj
      - down_proj

export:
  default_quant_types:
    - Q8_0
  keep_f16_gguf: false

evaluation:
  n_ctx: 512
  n_predict: 48
  temperature: 0.0
  top_k: 1
  top_p: 1.0
  repeat_penalty: 1.0
  server_port: 18080
  server_start_timeout_seconds: 120

baseline:
  deployed_q8:
    exact_match_rate: 0.9415384615
    open_to_close: 0
  release_gate:
    min_json_valid_rate: 1.0
    min_exact_match_rate: 0.935
    max_long_to_short: 0
    max_short_to_long: 0
    max_open_to_close: 0
    max_close_to_open: 0
