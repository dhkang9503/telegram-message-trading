name: Temp migrate PR 43 system prompt

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/migrate-pr43-system-prompt.yml
      - scripts/migrate_pr43_system_prompt.py

permissions:
  contents: write

jobs:
  migrate:
    if: github.head_ref == 'revert/pr43-system-prompt' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: revert/pr43-system-prompt
          fetch-depth: 0

      - name: Restore PR 43 system prompt
        run: python scripts/migrate_pr43_system_prompt.py

      - name: Commit migrated prompt files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            configs/train.yaml \
            data/base/train.jsonl \
            data/base/validation.jsonl \
            data/base/test.jsonl \
            data/regression/live_failures.jsonl \
            live/live_bot.py \
            tests/test_system_prompt_contract.py
          git diff --cached --quiet && exit 0
          git commit -m "Restore PR 43 system prompt"
          git push origin HEAD:revert/pr43-system-prompt
