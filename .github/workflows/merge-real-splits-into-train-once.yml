name: Merge real splits into train once

on:
  push:
    branches:
      - data/train-on-all-real-splits
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main

permissions:
  contents: write

jobs:
  merge-splits:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout merge branch
        uses: actions/checkout@v6
        with:
          ref: data/train-on-all-real-splits
          fetch-depth: 0

      - name: Append validation and test rows to train
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          train_path = Path("data/base/train.jsonl")
          validation_path = Path("data/base/validation.jsonl")
          test_path = Path("data/base/test.jsonl")

          train = train_path.read_text(encoding="utf-8").splitlines()
          validation = validation_path.read_text(encoding="utf-8").splitlines()
          test = test_path.read_text(encoding="utf-8").splitlines()

          expected = {"train": 1515, "validation": 324, "test": 325}
          actual = {"train": len(train), "validation": len(validation), "test": len(test)}
          if actual != expected:
              raise RuntimeError(f"unexpected split row counts: {actual}, expected {expected}")

          combined = train + validation + test
          if len(combined) != 2164:
              raise RuntimeError(f"expected 2164 combined rows, got {len(combined)}")

          for line_number, line in enumerate(combined, start=1):
              row = json.loads(line)
              user_message = row["messages"][1]["content"]
              if "<img>" in user_message:
                  raise RuntimeError(f"literal <img> remains at combined train line {line_number}")

          train_path.write_text("\n".join(combined) + "\n", encoding="utf-8")

          test_file = Path("tests/test_data_pipeline.py")
          source = test_file.read_text(encoding="utf-8")
          source = source.replace(
              "# Base train contains only the user-identified real channel rows after synthetic cleanup.\n"
              "EXPECTED_REAL_TRAIN_ROWS = 1515",
              "# Operational training uses every available real channel row from train, validation, and test.\n"
              "EXPECTED_TRAIN_ROWS = 2164",
          )
          source = source.replace("EXPECTED_REAL_TRAIN_ROWS", "EXPECTED_TRAIN_ROWS")
          if "EXPECTED_TRAIN_ROWS = 2164" not in source:
              raise RuntimeError("failed to update expected train row count in tests")
          test_file.write_text(source, encoding="utf-8")

          print("train rows: 1515 + validation rows: 324 + test rows: 325")
          print("combined operational train rows: 2164")
          PY

      - name: Commit combined train dataset
        shell: bash
        run: |
          rm .github/workflows/merge-real-splits-into-train-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/base/train.jsonl tests/test_data_pipeline.py \
            .github/workflows/merge-real-splits-into-train-once.yml
          git commit -m "Train on all real channel split data"
          git push origin HEAD:data/train-on-all-real-splits
