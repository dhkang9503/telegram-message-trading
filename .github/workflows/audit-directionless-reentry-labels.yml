name: Export reentry dataset snapshot

on:
  pull_request:
    types: [synchronize]
    branches: [main]

permissions:
  contents: read

jobs:
  export:
    if: github.head_ref == 'fix/directionless-reentry-labels'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Upload relevant files
        uses: actions/upload-artifact@v4
        with:
          name: reentry-dataset-snapshot
          path: |
            data/base/train.jsonl
            data/base/validation.jsonl
            data/base/test.jsonl
            data/feedback/mistakes_labeled.jsonl
            scripts/validate_dataset.py
            tests/test_data_pipeline.py
          if-no-files-found: error
