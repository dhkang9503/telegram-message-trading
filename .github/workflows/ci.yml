name: Validate repository

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  actions: write
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-ci.txt

      - name: Validate data
        run: python scripts/validate_dataset.py --root .

      - name: Run tests
        run: pytest -q

      - name: Delete obsolete workflow run history
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          mapfile -t active_workflow_ids < <(
            gh api --paginate \
              "repos/${GITHUB_REPOSITORY}/actions/workflows?per_page=100" \
              --jq '.workflows[] | select(
                .path == ".github/workflows/ci.yml" or
                .path == ".github/workflows/deploy.yml" or
                .path == ".github/workflows/train.yml" or
                .path == ".github/workflows/deploy-live-bot.yml"
              ) | .id'
          )

          if [ "${#active_workflow_ids[@]}" -ne 4 ]; then
            printf 'Expected 4 active workflows, found %s: %s\n' \
              "${#active_workflow_ids[@]}" "${active_workflow_ids[*]}" >&2
            exit 1
          fi

          declare -A active_workflows=()
          for workflow_id in "${active_workflow_ids[@]}"; do
            active_workflows["$workflow_id"]=1
          done

          mapfile -t workflow_runs < <(
            gh api --paginate \
              "repos/${GITHUB_REPOSITORY}/actions/runs?per_page=100" \
              --jq '.workflow_runs[] | [.id, .workflow_id, .name, .status] | @tsv'
          )

          deleted=0
          for workflow_run in "${workflow_runs[@]}"; do
            IFS=$'\t' read -r run_id workflow_id workflow_name status <<< "$workflow_run"
            [ "$status" = "completed" ] || continue
            [ -z "${active_workflows[$workflow_id]:-}" ] || continue

            echo "Deleting obsolete run ${run_id}: ${workflow_name} (workflow ${workflow_id})"
            gh api --method DELETE \
              "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}"
            ((deleted += 1))
          done

          mapfile -t remaining_runs < <(
            gh api --paginate \
              "repos/${GITHUB_REPOSITORY}/actions/runs?per_page=100" \
              --jq '.workflow_runs[] | [.id, .workflow_id, .name, .status] | @tsv'
          )

          remaining=0
          for workflow_run in "${remaining_runs[@]}"; do
            IFS=$'\t' read -r run_id workflow_id workflow_name status <<< "$workflow_run"
            [ "$status" = "completed" ] || continue
            [ -z "${active_workflows[$workflow_id]:-}" ] || continue
            echo "Obsolete run still remains: ${run_id}: ${workflow_name} (workflow ${workflow_id})" >&2
            ((remaining += 1))
          done

          if [ "$remaining" -ne 0 ]; then
            echo "Cleanup incomplete: ${remaining} obsolete workflow run(s) remain." >&2
            exit 1
          fi

          echo "Deleted ${deleted} obsolete workflow run(s); 0 remain."
