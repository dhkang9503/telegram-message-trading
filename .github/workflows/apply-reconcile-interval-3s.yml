name: Apply reconcile interval change

on:
  push:
    branches:
      - fix/reconcile-interval-3s

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/reconcile-interval-3s

      - name: Change default reconcile interval
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("live/live_bot.py")
          text = path.read_text(encoding="utf-8")
          old = 'RECONCILE_INTERVAL_SECONDS = float(os.getenv("RECONCILE_INTERVAL_SECONDS", "10"))'
          new = 'RECONCILE_INTERVAL_SECONDS = float(os.getenv("RECONCILE_INTERVAL_SECONDS", "3"))'
          if text.count(old) != 1:
              raise SystemExit(f"expected exactly one target line, found {text.count(old)}")
          path.write_text(text.replace(old, new), encoding="utf-8")
          PY

      - name: Validate syntax
        run: python -m py_compile live/live_bot.py

      - name: Commit change and remove temporary workflow
        run: |
          rm .github/workflows/apply-reconcile-interval-3s.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add live/live_bot.py .github/workflows/apply-reconcile-interval-3s.yml
          git commit -m "Reduce reconcile polling interval to 3 seconds"
          git push origin HEAD:fix/reconcile-interval-3s
