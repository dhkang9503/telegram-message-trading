name: Apply stop-loss fail-safe fix

on:
  push:
    branches: [fix/bitget-stop-loss-failsafe]
    paths: [.github/workflows/apply-stop-loss-fix.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/bitget-stop-loss-failsafe
          fetch-depth: 0

      - name: Patch and compile live bot
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          path = Path("live/live_bot.py")
          text = path.read_text(encoding="utf-8")

          request_method = text.index("    async def request(")
          response_start = text.index("        response.raise_for_status()\n", request_method)
          response_marker = '        return payload.get("data")\n'
          response_end = text.index(response_marker, response_start) + len(response_marker)
          new_response = textwrap.indent(textwrap.dedent('''
          try:
              payload = response.json()
          except ValueError:
              payload = None
          if response.is_error:
              if isinstance(payload, dict):
                  raise BitgetAPIError(
                      str(payload.get("code") or f"HTTP_{response.status_code}"),
                      str(payload.get("msg") or response.reason_phrase),
                      payload,
                  )
              raise BitgetAPIError(
                  f"HTTP_{response.status_code}",
                  response.text[:500] or response.reason_phrase,
                  {"status_code": response.status_code, "body": response.text[:500]},
              )
          if not isinstance(payload, dict):
              raise BitgetAPIError(
                  "INVALID_RESPONSE",
                  "Bitget returned a non-JSON response",
                  {"status_code": response.status_code, "body": response.text[:500]},
              )
          if str(payload.get("code")) != "00000":
              raise BitgetAPIError(str(payload.get("code")), str(payload.get("msg")), payload)
          return payload.get("data")
          ''').lstrip(), "        ")
          text = text[:response_start] + new_response + text[response_end:]

          set_plan_start = text.index("    async def set_plan(")
          execute_start = text.index("\n    async def execute(", set_plan_start)
          new_set_plan = textwrap.indent(textwrap.dedent('''
          async def _close_after_stop_failure(
              self,
              *,
              position_snapshot: dict[str, Any],
              trigger: Decimal,
              reference: Decimal,
              message_id: int,
              index: int,
              reason: str,
              error: Optional[str] = None,
          ) -> dict[str, Any]:
              failsafe_client_oid = client_oid(message_id, index, "sl-failsafe")
              close_result = await self.close_all(message_id, index, reason)
              self._remember_stopped_position(
                  position_snapshot,
                  {
                      "order_id": f"failsafe-{failsafe_client_oid}",
                      "client_oid": failsafe_client_oid,
                      "price": ds(trigger),
                  },
                  {
                      "executeOrderId": "failsafe-market-close",
                      "uTime": str(int(time.time() * 1000)),
                  },
              )
              self.state.save()
              record: dict[str, Any] = {
                  "closed_immediately": True,
                  "reason": reason,
                  "trigger_price": ds(trigger),
                  "reference_price": ds(reference),
                  "close": close_result,
              }
              if error:
                  record["plan_error"] = error
              self.log("STOP_FAILSAFE_CLOSED", **record)
              return record

          async def set_plan(self, stop: bool, raw_price: Any, message_id: int, index: int) -> dict[str, Any]:
              pos = self.require_position()
              position_snapshot = pos.copy()
              reference = await self.reference_price()
              if raw_price is None:
                  if stop:
                      raise BotError("SET_STOP requires an explicit price")
                  trigger = self.config.floor_price(D(pos.get("break_even_price")))
                  source = "break_even"
              else:
                  trigger = restore_btc_price(raw_price, reference, self.config)
                  source = "message"
              slot = "stop_order" if stop else "tp_order"
              plan_type = "pos_loss" if stop else "pos_profit"
              await self.cancel_plan_slot(slot)

              stop_already_crossed = stop and (
                  (pos["side"] == "long" and reference <= trigger)
                  or (pos["side"] == "short" and reference >= trigger)
              )
              if stop_already_crossed:
                  self.log(
                      "STOP_TRIGGER_ALREADY_CROSSED",
                      side=pos["side"],
                      trigger_price=ds(trigger),
                      reference_price=ds(reference),
                  )
                  return await self._close_after_stop_failure(
                      position_snapshot=position_snapshot,
                      trigger=trigger,
                      reference=reference,
                      message_id=message_id,
                      index=index,
                      reason="SET_STOP_TRIGGER_ALREADY_CROSSED",
                  )

              coid = client_oid(message_id, index, "sl" if stop else "tp")
              try:
                  result = await self.api.place_plan(
                      plan_type=plan_type,
                      hold_side="buy" if pos["side"] == "long" else "sell",
                      trigger_price=trigger,
                      client_oid=coid,
                  )
              except Exception as exc:
                  if not stop:
                      raise
                  error = f"{type(exc).__name__}: {exc}"
                  self.log(
                      "STOP_PLAN_PLACE_FAILED",
                      error=error,
                      side=pos["side"],
                      trigger_price=ds(trigger),
                      reference_price=ds(reference),
                  )
                  return await self._close_after_stop_failure(
                      position_snapshot=position_snapshot,
                      trigger=trigger,
                      reference=reference,
                      message_id=message_id,
                      index=index,
                      reason="SET_STOP_PLACE_FAILED",
                      error=error,
                  )
              record = {
                  "order_id": str(result.get("orderId")), "client_oid": coid, "price": ds(trigger),
                  "plan_type": plan_type, "source": source, "created_at": now_iso(),
              }
              self.state.data["pending"][slot] = record
              self.state.save()
              self.log("POSITION_PLAN_SET", slot=slot, **record)
              return record
          ''').lstrip(), "    ")
          text = text[:set_plan_start] + new_set_plan + text[execute_start:]

          compile(text, str(path), "exec")
          path.write_text(text, encoding="utf-8")
          PY
          python -m py_compile live/live_bot.py

      - name: Commit source and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add live/live_bot.py
          git rm .github/workflows/apply-stop-loss-fix.yml
          git commit -m "Add fail-safe handling for rejected stop-loss plans"
          git push origin HEAD:fix/bitget-stop-loss-failsafe
