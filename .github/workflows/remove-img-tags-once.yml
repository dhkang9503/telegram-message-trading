name: Remove image tags from dataset splits

on:
  push:
    branches:
      - fix/remove-img-tags-from-splits

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout cleanup branch
        uses: actions/checkout@v6
        with:
          ref: fix/remove-img-tags-from-splits
          fetch-depth: 0

      - name: Remove literal image tags and validate JSONL
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          paths = [
              Path("data/base/train.jsonl"),
              Path("data/base/validation.jsonl"),
              Path("data/base/test.jsonl"),
          ]

          total_removed = 0
          for path in paths:
              original = path.read_text(encoding="utf-8")
              removed = original.count("<img>")
              cleaned = original.replace("<img>", "")

              for line_number, line in enumerate(cleaned.splitlines(), start=1):
                  if line.strip():
                      json.loads(line)

              if "<img>" in cleaned:
                  raise RuntimeError(f"<img> remains in {path}")

              path.write_text(cleaned, encoding="utf-8")
              total_removed += removed
              print(f"{path}: removed {removed} literal <img> tags")

          print(f"total removed: {total_removed}")
          PY

      - name: Commit normalized dataset files
        shell: bash
        run: |
          rm .github/workflows/remove-img-tags-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/base/train.jsonl data/base/validation.jsonl data/base/test.jsonl \
            .github/workflows/remove-img-tags-once.yml
          git commit -m "Remove <img> tags from train validation and test data"
          git push origin HEAD:fix/remove-img-tags-from-splits
