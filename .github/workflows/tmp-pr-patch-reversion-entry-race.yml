name: Temporary PR patch reversion entry race

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.ref == 'fix/reversion-entry-candle-race'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/reversion-entry-candle-race
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply patch
        run: python scripts/patch_reversion_entry_race.py
      - name: Run tests
        run: |
          python -m pip install -r requirements-ci.txt
          pytest -q
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add reversion_live/main.py tests/test_reversion_multisymbol_profiles.py tests/test_reversion_entry_boundary.py
          git diff --cached --check
          git commit -m "fix: tolerate entry candle boundary lag"
          git push origin HEAD:fix/reversion-entry-candle-race
