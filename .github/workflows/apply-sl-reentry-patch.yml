name: Apply SL reentry patch

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'fix/sl-verified-reentry'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Patch live reentry handling
        run: |
          python .github/apply_sl_reentry_patch.py
          python -m py_compile live/live_bot.py

      - name: Commit patch and remove temporary files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-sl-reentry-patch.yml .github/apply_sl_reentry_patch.py
          git add live/live_bot.py
          git commit -m "Handle reentry from verified stop-loss state"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
