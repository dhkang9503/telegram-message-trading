name: Normalize image tags once

on:
  push:
    branches:
      - data/mistake-v2-and-img-cleanup

permissions:
  contents: write

jobs:
  normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout cleanup branch
        uses: actions/checkout@v6
        with:
          ref: data/mistake-v2-and-img-cleanup
          fetch-depth: 0

      - name: Remove literal image tags and validate JSONL
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          paths = [
              Path("data/base/train.jsonl"),
              Path("data/base/validation.jsonl"),
              Path("data/base/test.jsonl"),
              Path("data/feedback/mistakes_labeled.jsonl"),
          ]

          total_removed = 0
          for path in paths:
              original = path.read_text(encoding="utf-8")
              removed = original.count("<img>")
              cleaned = original.replace("<img>", "")

              for line_number, line in enumerate(cleaned.splitlines(), start=1):
                  if line.strip():
                      json.loads(line)

              if "<img>" in cleaned:
                  raise RuntimeError(f"<img> remains in {path}")

              path.write_text(cleaned, encoding="utf-8")
              total_removed += removed
              print(f"{path}: removed {removed} literal <img> tags")

          print(f"total removed: {total_removed}")
          PY

      - name: Validate normalized repository data
        run: python scripts/validate_dataset.py

      - name: Commit normalized files
        shell: bash
        run: |
          rm .github/workflows/normalize-img-tags-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/base/train.jsonl data/base/validation.jsonl data/base/test.jsonl \
            data/feedback/mistakes_labeled.jsonl scripts/validate_dataset.py \
            .github/workflows/normalize-img-tags-once.yml
          git commit -m "Remove remaining <img> tags from model inputs"
          git push origin HEAD:data/mistake-v2-and-img-cleanup
