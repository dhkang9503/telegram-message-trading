name: Deploy scenario monitor bot

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref containing scenario_monitor/main.py to deploy
        required: true
        default: main
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-scenario-monitor-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy scenario_monitor/main.py to EC2
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      EC2_HOST: ${{ secrets.EC2_HOST }}
      EC2_USER: ${{ secrets.EC2_USER }}
      EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
      EC2_PORT: ${{ vars.EC2_SSH_PORT || '22' }}
      BOT_SERVICE: ${{ vars.EC2_SCENARIO_MONITOR_SERVICE || 'scenario-monitor' }}

    steps:
      - name: Check out requested ref
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Resolve deployed commit
        run: echo "DEPLOY_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate scenario monitor bot
        run: |
          set -euo pipefail
          python -m py_compile scenario_monitor/*.py
          bash -n scenario_monitor/deploy_remote.sh
          python scenario_monitor/main.py --validate
          python -m unittest discover -s tests -p 'test_scenario*.py' -v

      - name: Configure SSH
        run: |
          set -euo pipefail

          for variable in EC2_HOST EC2_USER EC2_SSH_KEY; do
            if [ -z "${!variable}" ]; then
              echo "Required secret is empty: ${variable}" >&2
              exit 1
            fi
          done

          [[ "$EC2_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*$ ]]
          [[ "$EC2_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
          [[ "$EC2_PORT" =~ ^[0-9]{1,5}$ ]]
          (( 10#$EC2_PORT >= 1 && 10#$EC2_PORT <= 65535 ))
          [[ "$BOT_SERVICE" =~ ^[a-zA-Z0-9][a-zA-Z0-9_.@-]*$ ]]

          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$EC2_SSH_KEY" | tr -d '\r' > "$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/deploy_key"
          ssh-keyscan -p "$EC2_PORT" -H "$EC2_HOST" >> "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Upload and restart scenario monitor bot
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          archive="scenario-monitor-${DEPLOY_SHA}-${RUN_ID}.tar.gz"
          remote_tmp="/tmp/${archive}"
          tar -czf "$archive" -C scenario_monitor main.py execution.py execution_store.py binance_futures.py
          scp -i "$HOME/.ssh/deploy_key" -P "$EC2_PORT" \
            -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=yes \
            "$archive" "${EC2_USER}@${EC2_HOST}:${remote_tmp}"
          ssh -i "$HOME/.ssh/deploy_key" -p "$EC2_PORT" \
            -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=yes \
            "${EC2_USER}@${EC2_HOST}" \
            "bash -s -- '$remote_tmp' '$BOT_SERVICE' '$DEPLOY_SHA'" \
            < scenario_monitor/deploy_remote.sh

      - name: Deployment summary
        if: success()
        env:
          REQUESTED_REF: ${{ inputs.ref }}
        run: |
          {
            echo "### Scenario monitor bot deployed"
            echo "- Ref: \`${REQUESTED_REF}\`"
            echo "- Commit: \`${DEPLOY_SHA}\`"
            echo "- Target: \`~/scenario_monitor/main.py\`"
            echo "- Service: \`${BOT_SERVICE}\`"
          } >> "$GITHUB_STEP_SUMMARY"
