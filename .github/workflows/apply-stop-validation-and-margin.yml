name: Apply stop validation and margin fix

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: fix/validate-dedup-stop-actions

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply implementation and tests
        run: |
          python - <<'PY'
          from pathlib import Path

          bot_path = Path("live/live_bot.py")
          text = bot_path.read_text(encoding="utf-8")

          old_margin = 'INITIAL_MARGIN_USDT = Decimal("1")'
          new_margin = 'INITIAL_MARGIN_USDT = Decimal("6")'
          if text.count(old_margin) != 1:
              raise SystemExit("Expected initial margin constant exactly once")
          text = text.replace(old_margin, new_margin, 1)

          old_source = '            sizing_source = "fixed_1_usdt"'
          new_source = '            sizing_source = "fixed_6_usdt"'
          if text.count(old_source) != 1:
              raise SystemExit("Expected fixed sizing source exactly once")
          text = text.replace(old_source, new_source, 1)

          helper_marker = '''    return config.floor_price(restored)\n\n\ndef extract_stop_correction_fragment'''
          helper_replacement = '''    return config.floor_price(restored)\n\n\ndef stop_action_validation_error(\n    action: dict[str, Any],\n    reference: Decimal,\n    position_side: str,\n    config: ContractConfig,\n) -> Optional[str]:\n    """Return a rejection reason when a SET_STOP cannot safely execute."""\n    if action.get("type") != "SET_STOP":\n        return None\n    raw_price = action.get("price")\n    if raw_price is None:\n        return "SET_STOP requires an explicit price"\n    try:\n        trigger = restore_btc_price(raw_price, reference, config)\n    except BotError as exc:\n        return str(exc)\n    if position_side == "long":\n        if trigger >= reference:\n            return f"Long stop {trigger} must be below mark price {reference}"\n    elif position_side == "short":\n        if trigger <= reference:\n            return f"Short stop {trigger} must be above mark price {reference}"\n    else:\n        return f"Invalid position side for stop validation: {position_side}"\n    return None\n\n\ndef validate_and_deduplicate_stop_actions(\n    actions: list[dict[str, Any]],\n    reference: Decimal,\n    position_side: str,\n    config: ContractConfig,\n) -> tuple[\n    list[dict[str, Any]],\n    list[dict[str, Any]],\n    list[dict[str, Any]],\n]:\n    """Validate every SET_STOP, then keep only the last valid one."""\n    validated: list[dict[str, Any]] = []\n    rejected: list[dict[str, Any]] = []\n    for action in actions:\n        error = stop_action_validation_error(\n            action, reference, position_side, config\n        )\n        if error is not None:\n            rejected.append({"action": action, "reason": error})\n        else:\n            validated.append(action)\n\n    last_stop_index = next(\n        (\n            index\n            for index in range(len(validated) - 1, -1, -1)\n            if validated[index].get("type") == "SET_STOP"\n        ),\n        None,\n    )\n    normalized: list[dict[str, Any]] = []\n    deduplicated: list[dict[str, Any]] = []\n    for index, action in enumerate(validated):\n        if action.get("type") == "SET_STOP" and index != last_stop_index:\n            deduplicated.append({\n                "action": action,\n                "reason": "superseded_by_later_valid_set_stop",\n            })\n        else:\n            normalized.append(action)\n    return normalized, rejected, deduplicated\n\n\ndef extract_stop_correction_fragment'''
          if "def validate_and_deduplicate_stop_actions(" in text:
              raise SystemExit("Stop normalization helpers already exist")
          if text.count(helper_marker) != 1:
              raise SystemExit("Expected price restoration insertion point exactly once")
          text = text.replace(helper_marker, helper_replacement, 1)

          execution_marker = '''                        actions = prioritize_cancel_actions(actions)\n                        record["actions"] = actions\n'''
          execution_replacement = '''                        if any(\n                            action.get("type") == "SET_STOP"\n                            for action in actions\n                        ):\n                            reference = await engine.reference_price()\n                            position_side = str(engine.require_position()["side"])\n                            (\n                                actions,\n                                rejected_actions,\n                                deduplicated_actions,\n                            ) = validate_and_deduplicate_stop_actions(\n                                actions, reference, position_side, config\n                            )\n                            if rejected_actions:\n                                record["rejected_actions"] = rejected_actions\n                            if deduplicated_actions:\n                                record["deduplicated_actions"] = deduplicated_actions\n\n                        actions = prioritize_cancel_actions(actions)\n                        record["actions"] = actions\n'''
          if text.count(execution_marker) != 1:
              raise SystemExit("Expected execution normalization point exactly once")
          text = text.replace(execution_marker, execution_replacement, 1)
          bot_path.write_text(text, encoding="utf-8")

          test_path = Path("tests/test_live_stop_normalization.py")
          test_path.write_text('''from __future__ import annotations\n\nimport ast\nfrom decimal import Decimal, ROUND_DOWN\nfrom pathlib import Path\n\n\ndef load_stop_normalization():\n    source = Path("live/live_bot.py").read_text(encoding="utf-8")\n    module = ast.parse(source)\n    names = {\n        "BotError",\n        "D",\n        "restore_btc_price",\n        "stop_action_validation_error",\n        "validate_and_deduplicate_stop_actions",\n    }\n    nodes = [\n        node\n        for node in module.body\n        if isinstance(node, (ast.ClassDef, ast.FunctionDef))\n        and node.name in names\n    ]\n    namespace = {\n        "Decimal": Decimal,\n        "ROUND_DOWN": ROUND_DOWN,\n        "PRICE_RESTORE_MAX_GAP_RATIO": Decimal("0.03"),\n    }\n    exec(\n        "from __future__ import annotations\\n"\n        "from typing import Any, Optional\\n"\n        + "\\n\\n".join(ast.get_source_segment(source, node) for node in nodes),\n        namespace,\n    )\n    return namespace\n\n\nclass Config:\n    price_step = Decimal("0.1")\n\n    def floor_price(self, value: Decimal) -> Decimal:\n        units = (value / self.price_step).to_integral_value(\n            rounding=ROUND_DOWN\n        )\n        return units * self.price_step\n\n\nns = load_stop_normalization()\nvalidate_and_deduplicate_stop_actions = ns[\n    "validate_and_deduplicate_stop_actions"\n]\n\n\ndef action(action_type: str, price: int | None = None) -> dict:\n    return {"type": action_type, "price": price}\n\n\ndef test_validation_happens_before_stop_deduplication():\n    actions = [\n        action("ADD", 64100),\n        action("SET_STOP", 64410),\n        action("SET_STOP", 64),\n    ]\n\n    normalized, rejected, deduplicated = (\n        validate_and_deduplicate_stop_actions(\n            actions, Decimal("63872.2"), "short", Config()\n        )\n    )\n\n    assert normalized == [\n        action("ADD", 64100),\n        action("SET_STOP", 64410),\n    ]\n    assert rejected[0]["action"] == action("SET_STOP", 64)\n    assert "must be above mark price" in rejected[0]["reason"]\n    assert deduplicated == []\n\n\ndef test_last_valid_stop_wins_after_validation():\n    actions = [\n        action("SET_STOP", 64410),\n        action("ADD", 64100),\n        action("SET_STOP", 64500),\n    ]\n\n    normalized, rejected, deduplicated = (\n        validate_and_deduplicate_stop_actions(\n            actions, Decimal("63872.2"), "short", Config()\n        )\n    )\n\n    assert normalized == [\n        action("ADD", 64100),\n        action("SET_STOP", 64500),\n    ]\n    assert rejected == []\n    assert deduplicated == [{\n        "action": action("SET_STOP", 64410),\n        "reason": "superseded_by_later_valid_set_stop",\n    }]\n\n\ndef test_long_stop_must_be_below_mark_price():\n    actions = [\n        action("SET_STOP", 63000),\n        action("SET_STOP", 64410),\n    ]\n\n    normalized, rejected, deduplicated = (\n        validate_and_deduplicate_stop_actions(\n            actions, Decimal("63872.2"), "long", Config()\n        )\n    )\n\n    assert normalized == [action("SET_STOP", 63000)]\n    assert rejected[0]["action"] == action("SET_STOP", 64410)\n    assert deduplicated == []\n\n\ndef test_initial_margin_is_six_usdt():\n    source = Path("live/live_bot.py").read_text(encoding="utf-8")\n\n    assert 'INITIAL_MARGIN_USDT = Decimal("6")' in source\n    assert 'sizing_source = "fixed_6_usdt"' in source\n    assert 'sizing_source = "fixed_1_usdt"' not in source\n''', encoding="utf-8")
          PY

      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest

      - name: Validate
        run: |
          python -m py_compile live/live_bot.py
          pytest -q tests/test_live_action_order.py tests/test_live_stop_normalization.py

      - name: Commit patch and remove temporary workflow
        run: |
          rm .github/workflows/apply-stop-validation-and-margin.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add live/live_bot.py tests/test_live_stop_normalization.py .github/workflows/apply-stop-validation-and-margin.yml
          git commit -m "Validate stops before deduplication and raise initial margin"
          git push origin HEAD:fix/validate-dedup-stop-actions
