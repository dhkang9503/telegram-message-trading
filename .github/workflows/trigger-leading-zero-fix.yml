name: Trigger leading-zero price fix

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'fix/preserve-leading-zero-price-fragments'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/preserve-leading-zero-price-fragments
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run patch and verification steps
        shell: bash
        run: |
          python -m pip install pyyaml pytest
          python - <<'PY'
          from pathlib import Path
          import subprocess
          import yaml

          workflow = yaml.safe_load(
              Path('.github/workflows/apply-leading-zero-price-fix.yml').read_text(
                  encoding='utf-8'
              )
          )
          selected = {
              'Apply source and test changes',
              'Compile live bot',
              'Validate datasets',
              'Run tests',
          }
          for step in workflow['jobs']['apply']['steps']:
              if step.get('name') not in selected:
                  continue
              print(f"Running: {step['name']}", flush=True)
              subprocess.run(
                  step['run'],
                  shell=True,
                  check=True,
                  executable='/bin/bash',
              )
          PY

      - name: Commit tested changes
        shell: bash
        run: |
          rm .github/workflows/apply-leading-zero-price-fix.yml
          rm .github/workflows/trigger-leading-zero-fix.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add live/live_bot.py tests/test_live_price_token_alignment.py .github/workflows/apply-leading-zero-price-fix.yml .github/workflows/trigger-leading-zero-price-fix.yml
          git commit -m 'Preserve leading-zero price fragments'
          git push origin HEAD:fix/preserve-leading-zero-price-fragments
