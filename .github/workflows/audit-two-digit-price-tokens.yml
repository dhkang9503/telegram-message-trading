name: Audit two-digit price tokens

on:
  push:
    branches:
      - fix/preserve-leading-zero-price-fragments

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/preserve-leading-zero-price-fragments

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Scan all JSONL datasets
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations

          import json
          import re
          from collections import Counter, defaultdict
          from pathlib import Path
          from typing import Any

          root = Path('.')
          paths = sorted(root.glob('data/**/*.jsonl'))
          two_digit_re = re.compile(r'(?<![\d.])(\d{2})(?![\d.])')

          def parse_row(row: dict[str, Any]):
              if isinstance(row.get('messages'), list) and len(row['messages']) >= 3:
                  message = row['messages'][1].get('content')
                  try:
                      assistant = json.loads(row['messages'][2].get('content', '{}'))
                  except Exception:
                      assistant = {}
                  actions = assistant.get('actions', []) if isinstance(assistant, dict) else []
                  return message, actions, 'chatml'

              source = row.get('source')
              if isinstance(source, dict) and isinstance(source.get('message'), str):
                  message = source['message']
                  label = row.get('label')
                  if isinstance(label, dict) and isinstance(label.get('correct_actions'), list):
                      actions = label['correct_actions']
                  elif isinstance(row.get('actions'), list):
                      actions = row['actions']
                  elif isinstance(row.get('model_actions'), list):
                      actions = row['model_actions']
                  else:
                      actions = []
                  return message, actions, 'feedback'
              return None, [], 'unknown'

          occurrences = []
          unique: dict[tuple[str, tuple[str, ...]], dict[str, Any]] = {}
          total_rows = 0
          parsed_rows = 0

          for path in paths:
              for line_no, line in enumerate(path.read_text(encoding='utf-8').splitlines(), 1):
                  if not line.strip():
                      continue
                  total_rows += 1
                  try:
                      row = json.loads(line)
                  except Exception as exc:
                      print(json.dumps({'parse_error': str(path), 'line': line_no, 'error': str(exc)}, ensure_ascii=False))
                      continue
                  message, actions, row_type = parse_row(row)
                  if not isinstance(message, str):
                      continue
                  parsed_rows += 1
                  tokens = two_digit_re.findall(message)
                  if not tokens:
                      continue

                  priced_actions = [
                      {'type': action.get('type'), 'price': action.get('price')}
                      for action in actions
                      if isinstance(action, dict) and action.get('price') is not None
                  ]
                  matching = []
                  for token in tokens:
                      token_value = int(token)
                      matches = [
                          action for action in priced_actions
                          if isinstance(action.get('price'), (int, float))
                          and float(action['price']) == float(token_value)
                      ]
                      matching.append({'token': token, 'matching_actions': matches})

                  item = {
                      'path': str(path),
                      'line': line_no,
                      'row_type': row_type,
                      'message': message,
                      'two_digit_tokens': tokens,
                      'actions': actions,
                      'priced_actions': priced_actions,
                      'token_action_matches': matching,
                  }
                  occurrences.append(item)
                  key = (message, tuple(json.dumps(a, ensure_ascii=False, sort_keys=True) for a in actions))
                  entry = unique.setdefault(key, {
                      'message': message,
                      'two_digit_tokens': sorted(set(tokens)),
                      'actions': actions,
                      'locations': [],
                      'token_action_matches': matching,
                  })
                  entry['locations'].append({'path': str(path), 'line': line_no})

          print('=== AUDIT SUMMARY ===')
          print(json.dumps({
              'dataset_files': [str(path) for path in paths],
              'total_jsonl_rows': total_rows,
              'parsed_message_rows': parsed_rows,
              'occurrence_rows_with_two_digit_tokens': len(occurrences),
              'unique_message_action_pairs_with_two_digit_tokens': len(unique),
              'token_counts_occurrences': Counter(
                  token for item in occurrences for token in item['two_digit_tokens']
              ),
              'token_counts_unique': Counter(
                  token for item in unique.values() for token in item['two_digit_tokens']
              ),
          }, ensure_ascii=False, indent=2, default=dict))

          print('=== UNIQUE CASES ===')
          for index, item in enumerate(sorted(unique.values(), key=lambda x: x['message']), 1):
              print(json.dumps({'index': index, **item}, ensure_ascii=False, sort_keys=True))

          print('=== PRICE-MATCHED TWO-DIGIT CASES ===')
          matched = []
          for item in unique.values():
              matches = [m for m in item['token_action_matches'] if m['matching_actions']]
              if matches:
                  matched.append({**item, 'matched_only': matches})
          print(json.dumps({'count': len(matched)}, ensure_ascii=False))
          for index, item in enumerate(sorted(matched, key=lambda x: x['message']), 1):
              print(json.dumps({'index': index, **item}, ensure_ascii=False, sort_keys=True))
          PY
