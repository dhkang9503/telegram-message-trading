name: Train parser model

on:
  pull_request:
    types: [opened, synchronize]
    branches:
      - main
    paths:
      - ".github/workflows/train.yml"
      - "scripts/_migrate_short_prompt.py"

permissions:
  contents: write

jobs:
  migrate-short-prompt:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 2
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply shorter prompt migration
        run: python scripts/_migrate_short_prompt.py
      - name: Commit migrated prompt data
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No migration changes to commit."
            exit 0
          fi
          git commit -m "Apply shorter parser system prompt"
          git push origin "HEAD:${{ github.head_ref }}"
