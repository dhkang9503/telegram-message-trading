name: Normalize leading-zero fix formatting

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  format-and-test:
    if: github.head_ref == 'fix/preserve-leading-zero-price-fragments'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/preserve-leading-zero-price-fragments
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Normalize formatting
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('live/live_bot.py')
          text = path.read_text(encoding='utf-8')
          old = '''                        actions = align_action_prices_to_source(
                    source_text, list(parsed["actions"])
                )
          '''
          new = '''                        actions = align_action_prices_to_source(
                            source_text, list(parsed["actions"])
                        )
          '''
          if text.count(old) != 1:
              raise SystemExit('Expected misindented alignment call exactly once')
          text = text.replace(old, new, 1)
          compile(text, str(path), 'exec')
          path.write_text(text, encoding='utf-8')
          PY

      - name: Verify
        run: |
          python -m pip install pytest
          python -m py_compile live/live_bot.py
          python scripts/validate_dataset.py
          python -m pytest

      - name: Commit
        run: |
          rm .github/workflows/fix-leading-zero-indent.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Normalize price alignment formatting'
          git push origin HEAD:fix/preserve-leading-zero-price-fragments
