name: Normalize leading-zero fix formatting

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  format-and-test:
    if: github.head_ref == 'fix/preserve-leading-zero-price-fragments'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/preserve-leading-zero-price-fragments
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Normalize formatting
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('live/live_bot.py')
          lines = path.read_text(encoding='utf-8').splitlines(keepends=True)
          matches = [
              index
              for index, line in enumerate(lines)
              if line.strip() == 'actions = align_action_prices_to_source('
          ]
          if len(matches) != 1:
              raise SystemExit(f'Expected alignment call exactly once, got {matches}')
          index = matches[0]
          if (
              lines[index + 1].strip()
              != 'source_text, list(parsed["actions"])'
              or lines[index + 2].strip() != ')'
          ):
              raise SystemExit('Unexpected alignment call body')
          lines[index:index + 3] = [
              '                        actions = align_action_prices_to_source(\n',
              '                            source_text, list(parsed["actions"])\n',
              '                        )\n',
          ]
          text = ''.join(lines)
          compile(text, str(path), 'exec')
          path.write_text(text, encoding='utf-8')
          PY

      - name: Verify
        run: |
          python -m pip install pytest
          python -m py_compile live/live_bot.py
          python scripts/validate_dataset.py
          python -m pytest

      - name: Commit
        run: |
          rm .github/workflows/fix-leading-zero-indent.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Normalize price alignment formatting'
          git push origin HEAD:fix/preserve-leading-zero-price-fragments
