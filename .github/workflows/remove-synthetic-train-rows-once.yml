name: Remove synthetic train rows once

on:
  push:
    branches:
      - data/remove-synthetic-and-use-real-mistakes
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout cleanup branch
        uses: actions/checkout@v6
        with:
          ref: data/remove-synthetic-and-use-real-mistakes
          fetch-depth: 0

      - name: Remove identified synthetic train rows
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("data/base/train.jsonl")
          lines = path.read_text(encoding="utf-8").splitlines()
          if len(lines) != 1604:
              raise RuntimeError(f"expected 1604 train rows before cleanup, got {len(lines)}")

          # Keep lines 1-1514 and the known real row at line 1527.
          kept = lines[:1514] + [lines[1526]]
          if len(kept) != 1515:
              raise RuntimeError(f"expected 1515 train rows after cleanup, got {len(kept)}")

          for line in kept:
              json.loads(line)

          path.write_text("\n".join(kept) + "\n", encoding="utf-8")
          print("removed original lines 1515-1526 and 1528-1604")
          print("preserved original line 1527")
          print(f"train rows after cleanup: {len(kept)}")
          PY

      - name: Commit cleaned dataset
        shell: bash
        run: |
          rm .github/workflows/remove-synthetic-train-rows-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/base/train.jsonl data/feedback/mistakes_labeled.jsonl \
            tests/test_data_pipeline.py .github/workflows/remove-synthetic-train-rows-once.yml
          git commit -m "Remove synthetic train rows and use real mistakes"
          git push origin HEAD:data/remove-synthetic-and-use-real-mistakes
