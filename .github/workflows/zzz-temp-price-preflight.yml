name: Temporary price preflight patch

on:
  push:
    branches:
      - feat/price-typo-preflight

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/price-typo-preflight
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CI dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-ci.txt
      - name: Apply price preflight patch
        shell: python
        run: |
          from pathlib import Path

          bot_path = Path("live/live_bot.py")
          text = bot_path.read_text(encoding="utf-8")

          anchor = '''    return normalized, rejected, deduplicated\n\n\ndef extract_stop_correction_fragment(text: str) -> Optional[str]:\n'''
          if anchor not in text:
              raise SystemExit("live_bot helper insertion anchor not found")

          helper = '''    return normalized, rejected, deduplicated\n\n\ndef _json_price(price: Decimal) -> int | float:\n    integer = price.to_integral_value()\n    return int(integer) if price == integer else float(price)\n\n\ndef _leading_digit_price_candidate(\n    raw_price: Any,\n    reference: Decimal,\n    config: ContractConfig,\n) -> tuple[str, Decimal]:\n    raw = D(raw_price)\n    integer = raw.to_integral_value()\n    if raw <= 0 or raw != integer:\n        raise BotError(f"Leading-digit correction requires a positive integer price: {raw_price!r}")\n    text = str(abs(int(integer)))\n    if len(text) < 5:\n        raise BotError(f"Leading-digit correction requires a full BTC price: {raw_price!r}")\n    fragment = text[1:]\n    candidate = restore_btc_price(fragment, reference, config)\n    if candidate == config.floor_price(raw):\n        raise BotError(f"Leading-digit correction did not change price: {raw_price!r}")\n    return text[0], candidate\n\n\ndef _paired_add_stop_typo_correction(\n    actions: list[dict[str, Any]],\n    reference: Decimal,\n    position: dict[str, Any],\n    config: ContractConfig,\n) -> Optional[tuple[list[dict[str, Any]], list[dict[str, Any]]]]:\n    priced_adds = [\n        (index, action)\n        for index, action in enumerate(actions)\n        if action.get("type") == "ADD" and action.get("price") is not None\n    ]\n    priced_stops = [\n        (index, action)\n        for index, action in enumerate(actions)\n        if action.get("type") == "SET_STOP" and action.get("price") is not None\n    ]\n    if len(priced_adds) != 1 or len(priced_stops) != 1:\n        return None\n\n    add_index, add_action = priced_adds[0]\n    stop_index, stop_action = priced_stops[0]\n\n    # Auto-correction is deliberately narrow: both full prices must already be\n    # invalid against the live market. A single suspicious price is rejected,\n    # never guessed.\n    for action in (add_action, stop_action):\n        try:\n            restore_btc_price(action["price"], reference, config)\n        except BotError:\n            pass\n        else:\n            return None\n\n    try:\n        add_prefix, add_candidate = _leading_digit_price_candidate(\n            add_action["price"], reference, config\n        )\n        stop_prefix, stop_candidate = _leading_digit_price_candidate(\n            stop_action["price"], reference, config\n        )\n    except BotError:\n        return None\n\n    if add_prefix != stop_prefix:\n        return None\n\n    raw_add = D(add_action["price"])\n    raw_stop = D(stop_action["price"])\n    raw_delta = raw_add - raw_stop\n    corrected_delta = add_candidate - stop_candidate\n    if abs(raw_delta - corrected_delta) > config.price_step:\n        return None\n\n    side = str(position.get("side"))\n    entry = D(position.get("entry_price"))\n    if entry <= 0:\n        return None\n    if abs(add_candidate - entry) / entry > PRICE_RESTORE_MAX_GAP_RATIO:\n        return None\n    if side == "long":\n        if not (stop_candidate < add_candidate < entry):\n            return None\n    elif side == "short":\n        if not (stop_candidate > add_candidate > entry):\n            return None\n    else:\n        return None\n\n    corrected = [dict(action) for action in actions]\n    corrected[add_index]["price"] = _json_price(add_candidate)\n    corrected[stop_index]["price"] = _json_price(stop_candidate)\n    corrections = [\n        {\n            "action_index": add_index,\n            "type": "ADD",\n            "original_price": add_action["price"],\n            "corrected_price": corrected[add_index]["price"],\n        },\n        {\n            "action_index": stop_index,\n            "type": "SET_STOP",\n            "original_price": stop_action["price"],\n            "corrected_price": corrected[stop_index]["price"],\n        },\n    ]\n    return corrected, corrections\n\n\ndef preflight_and_correct_add_stop_prices(\n    actions: list[dict[str, Any]],\n    reference: Decimal,\n    position: dict[str, Any],\n    config: ContractConfig,\n) -> tuple[list[dict[str, Any]], list[dict[str, Any]], list[dict[str, Any]]]:\n    normalized = [dict(action) for action in actions]\n    corrections: list[dict[str, Any]] = []\n    pair = _paired_add_stop_typo_correction(\n        normalized, reference, position, config\n    )\n    if pair is not None:\n        normalized, corrections = pair\n\n    # ADD used to fail only inside execute(), which prevented a later valid\n    # SET_STOP in the same message from running. Reject an impossible priced\n    # ADD here instead; SET_STOP keeps its existing dedicated validation.\n    accepted: list[dict[str, Any]] = []\n    rejected: list[dict[str, Any]] = []\n    for action in normalized:\n        if action.get("type") != "ADD" or action.get("price") is None:\n            accepted.append(action)\n            continue\n        try:\n            restore_btc_price(action["price"], reference, config)\n        except BotError as exc:\n            rejected.append({"action": action, "reason": str(exc)})\n        else:\n            accepted.append(action)\n    return accepted, corrections, rejected\n\n\ndef extract_stop_correction_fragment(text: str) -> Optional[str]:\n'''
          text = text.replace(anchor, helper, 1)

          handler_anchor = '''                        actions = align_action_prices_to_source(\n                            source_text, list(parsed["actions"])\n                        )\n                        if not actions:\n'''
          if handler_anchor not in text:
              raise SystemExit("live_bot handler insertion anchor not found")

          handler_replacement = '''                        actions = align_action_prices_to_source(\n                            source_text, list(parsed["actions"])\n                        )\n                        record["model_actions"] = [dict(action) for action in actions]\n\n                        if (\n                            D(state.data["position"].get("total_qty")) > 0\n                            and any(\n                                action.get("type") in {"ADD", "SET_STOP"}\n                                and action.get("price") is not None\n                                for action in actions\n                            )\n                        ):\n                            reference = await engine.reference_price()\n                            position = engine.require_position()\n                            (\n                                actions,\n                                price_corrections,\n                                price_rejections,\n                            ) = preflight_and_correct_add_stop_prices(\n                                actions, reference, position, config\n                            )\n                            if price_corrections:\n                                record["price_corrections"] = price_corrections\n                                engine.log(\n                                    "PRICE_TYPO_PAIR_CORRECTED",\n                                    message_id=message.id,\n                                    message=source_text,\n                                    reference_price=ds(reference),\n                                    entry_price=str(position.get("entry_price")),\n                                    corrections=price_corrections,\n                                )\n                            if price_rejections:\n                                record.setdefault("rejected_actions", []).extend(\n                                    price_rejections\n                                )\n\n                        if not actions:\n'''
          text = text.replace(handler_anchor, handler_replacement, 1)

          reject_anchor = '''                            if rejected_actions:\n                                record["rejected_actions"] = rejected_actions\n'''
          if reject_anchor not in text:
              raise SystemExit("live_bot rejected-actions anchor not found")
          reject_replacement = '''                            if rejected_actions:\n                                record.setdefault("rejected_actions", []).extend(\n                                    rejected_actions\n                                )\n'''
          text = text.replace(reject_anchor, reject_replacement, 1)
          bot_path.write_text(text, encoding="utf-8")

          test_path = Path("tests/test_live_trading_engine_scenarios.py")
          tests = test_path.read_text(encoding="utf-8")
          marker = "def test_price_typo_pair_corrects_93860_93590_and_executes_both"
          if marker not in tests:
              tests += '''\n\n\ndef test_price_typo_pair_corrects_93860_93590_and_executes_both(rig):\n    engine, api, state, config = rig\n    api.mark_price = Decimal("64000")\n    execute(engine, "OPEN_LONG")\n    assert D(state.data["position"]["entry_price"]) == Decimal("64000")\n\n    original = [\n        {"type": "ADD", "price": 93860},\n        {"type": "SET_STOP", "price": 93590},\n    ]\n    actions, corrections, rejected = live.preflight_and_correct_add_stop_prices(\n        original, api.mark_price, state.data["position"], config\n    )\n\n    assert actions == [\n        {"type": "ADD", "price": 63860},\n        {"type": "SET_STOP", "price": 63590},\n    ]\n    assert [item["corrected_price"] for item in corrections] == [63860, 63590]\n    assert rejected == []\n\n    start = len(api.calls)\n    for index, action in enumerate(actions):\n        run(engine.execute(action, 14676, index, "93860물타기 93590손절 걸겠습니다!"))\n    calls = mutations(api, start)\n    assert [call["method"] for call in calls] == ["place_order", "place_plan"]\n    assert calls[0]["price"] == Decimal("63860")\n    assert calls[1]["trigger_price"] == Decimal("63590")\n\n\ndef test_single_bad_add_is_rejected_instead_of_guessed(rig):\n    engine, api, state, config = rig\n    api.mark_price = Decimal("64000")\n    execute(engine, "OPEN_LONG")\n\n    actions, corrections, rejected = live.preflight_and_correct_add_stop_prices(\n        [{"type": "ADD", "price": 93860}],\n        api.mark_price,\n        state.data["position"],\n        config,\n    )\n\n    assert actions == []\n    assert corrections == []\n    assert len(rejected) == 1\n    assert rejected[0]["action"] == {"type": "ADD", "price": 93860}\n    assert "too far from market" in rejected[0]["reason"]\n\n\ndef test_bad_add_does_not_block_valid_stop_in_preflight(rig):\n    engine, api, state, config = rig\n    api.mark_price = Decimal("64000")\n    execute(engine, "OPEN_LONG")\n\n    actions, corrections, rejected = live.preflight_and_correct_add_stop_prices(\n        [\n            {"type": "ADD", "price": 93860},\n            {"type": "SET_STOP", "price": 63590},\n        ],\n        api.mark_price,\n        state.data["position"],\n        config,\n    )\n\n    assert actions == [{"type": "SET_STOP", "price": 63590}]\n    assert corrections == []\n    assert len(rejected) == 1\n    validated, stop_rejected, deduplicated = live.validate_and_deduplicate_stop_actions(\n        actions, api.mark_price, "long", config\n    )\n    assert validated == actions\n    assert stop_rejected == []\n    assert deduplicated == []\n\n\ndef test_pair_is_not_corrected_when_long_structure_is_invalid(rig):\n    engine, api, state, config = rig\n    api.mark_price = Decimal("64000")\n    execute(engine, "OPEN_LONG")\n\n    actions, corrections, rejected = live.preflight_and_correct_add_stop_prices(\n        [\n            {"type": "ADD", "price": 93590},\n            {"type": "SET_STOP", "price": 93860},\n        ],\n        api.mark_price,\n        state.data["position"],\n        config,\n    )\n\n    assert corrections == []\n    assert actions == [{"type": "SET_STOP", "price": 93860}]\n    assert len(rejected) == 1\n    validated, stop_rejected, _ = live.validate_and_deduplicate_stop_actions(\n        actions, api.mark_price, "long", config\n    )\n    assert validated == []\n    assert len(stop_rejected) == 1\n\n\ndef test_short_pair_uses_mirrored_structure(rig):\n    engine, api, state, config = rig\n    api.mark_price = Decimal("64000")\n    execute(engine, "OPEN_SHORT")\n\n    actions, corrections, rejected = live.preflight_and_correct_add_stop_prices(\n        [\n            {"type": "ADD", "price": 94140},\n            {"type": "SET_STOP", "price": 94410},\n        ],\n        api.mark_price,\n        state.data["position"],\n        config,\n    )\n\n    assert actions == [\n        {"type": "ADD", "price": 64140},\n        {"type": "SET_STOP", "price": 64410},\n    ]\n    assert [item["corrected_price"] for item in corrections] == [64140, 64410]\n    assert rejected == []\n'''
              test_path.write_text(tests, encoding="utf-8")
      - name: Compile live bot
        run: python -m py_compile live/live_bot.py
      - name: Run trading-engine scenarios
        run: python -m pytest -q tests/test_live_trading_engine_scenarios.py
      - name: Run full test suite
        run: python -m pytest -q
      - name: Commit patched files and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/zzz-temp-price-preflight.yml
          git add live/live_bot.py tests/test_live_trading_engine_scenarios.py
          git commit -m "feat: recover paired leading-digit price typos"
          git push origin HEAD:feat/price-typo-preflight
