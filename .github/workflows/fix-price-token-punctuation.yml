name: Fix price token punctuation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch-and-test:
    if: github.head_ref == 'fix/preserve-leading-zero-price-fragments'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/preserve-leading-zero-price-fragments
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Patch punctuation handling and tests
        run: |
          python - <<'PY'
          from pathlib import Path

          live_path = Path('live/live_bot.py')
          live = live_path.read_text(encoding='utf-8')
          old_regex = 'SOURCE_PRICE_TOKEN_RE = re.compile(r"(?<![\\d,.])(\\d[\\d,]*(?:\\.\\d+)?)(?![\\d,.])")'
          new_regex = 'SOURCE_PRICE_TOKEN_RE = re.compile(r"(?<![\\d,])(\\d[\\d,]*(?:\\.\\d+)?)(?![\\d,]|\\.\\d)")'
          if live.count(old_regex) != 1:
              raise SystemExit('Expected production price-token regex exactly once')
          live = live.replace(old_regex, new_regex, 1)
          compile(live, str(live_path), 'exec')
          live_path.write_text(live, encoding='utf-8')

          test_path = Path('tests/test_live_price_token_alignment.py')
          tests = test_path.read_text(encoding='utf-8')
          old_test_regex = 'r"(?<![\\d,.])(\\d[\\d,]*(?:\\.\\d+)?)(?![\\d,.])"'
          new_test_regex = 'r"(?<![\\d,])(\\d[\\d,]*(?:\\.\\d+)?)(?![\\d,]|\\.\\d)"'
          if tests.count(old_test_regex) != 1:
              raise SystemExit('Expected test price-token regex exactly once')
          tests = tests.replace(old_test_regex, new_test_regex, 1)

          marker = '''def test_two_different_short_prices_align_independently():
          '''
          addition = '''def test_sentence_period_after_leading_zero_price_is_not_a_decimal():
              message = "050. 물타기 걸게요"
              actions = [action("ADD", 50)]

              assert align_action_prices_to_source(message, actions) == [
                  {"type": "ADD", "price": "050"}
              ]
              assert restored_prices(message, actions, "63734.2") == [
                  Decimal("64050")
              ]


          def test_two_different_short_prices_align_independently():
          '''
          if tests.count(marker) != 1:
              raise SystemExit('Expected multi-price test marker exactly once')
          tests = tests.replace(marker, addition, 1)
          compile(tests, str(test_path), 'exec')
          test_path.write_text(tests, encoding='utf-8')
          PY

      - name: Verify
        run: |
          python -m pip install pytest
          python -m py_compile live/live_bot.py
          python scripts/validate_dataset.py
          python -m pytest

      - name: Commit
        run: |
          rm .github/workflows/fix-price-token-punctuation.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Accept sentence punctuation after price fragments'
          git push origin HEAD:fix/preserve-leading-zero-price-fragments
