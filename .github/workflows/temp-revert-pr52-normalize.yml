name: Temp revert PR 52 and normalize shorthand

on:
  push:
    branches:
      - fix/revert-pr52-and-normalize-shorthand
    paths:
      - .github/workflows/temp-revert-pr52-normalize.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/revert-pr52-and-normalize-shorthand

      - name: Revert training rows and add runtime normalization
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import json
          from pathlib import Path

          feedback_path = Path("data/feedback/mistakes_labeled.jsonl")
          pr52_messages = {
              "물 ㅂㅈ",
              "롱 ㅂㅈ",
              "롱ㅂㅈ",
              "숏 ㅂㅈ",
              "숏ㅂㅈ",
              "반익 ㅂㅈ",
              "반익ㅂㅈ",
              "익자유 ㅂㅈ",
              "익자유ㅂㅈ",
              "익절 ㅂㅈ",
              "익절ㅂㅈ",
          }
          kept: list[str] = []
          removed: set[str] = set()
          for line in feedback_path.read_text(encoding="utf-8").splitlines():
              row = json.loads(line)
              message = row["source"]["message"]
              if message in pr52_messages:
                  removed.add(message)
              else:
                  kept.append(line)
          if removed != pr52_messages:
              raise SystemExit(
                  f"Expected to remove all PR 52 messages; missing={sorted(pr52_messages - removed)!r}"
              )
          feedback_path.write_text("\n".join(kept) + "\n", encoding="utf-8")

          live_path = Path("live/live_bot.py")
          live_text = live_path.read_text(encoding="utf-8")
          old = '''def normalize_trading_shorthand(text: str) -> str:
              replacements = {
                  "물ㅂㅈ": "물 ㅂㅈ",
              }
              return replacements.get(text, text)
          '''
          new = '''def normalize_trading_shorthand(text: str) -> str:
              canonical_by_compact = {
                  "물ㅂㅈ": "물 ㅂㅈ",
                  "롱ㅂㅈ": "롱 ㅂㅈ",
                  "숏ㅂㅈ": "숏 ㅂㅈ",
                  "반익ㅂㅈ": "반익 ㅂㅈ",
                  "익자유ㅂㅈ": "익자유 ㅂㅈ",
                  "익절ㅂㅈ": "익절 ㅂㅈ",
              }
              compact = re.sub(r"\\s+", "", text)
              return canonical_by_compact.get(compact, text)
          '''
          if live_text.count(old) != 1:
              raise SystemExit("Could not find the expected shorthand normalizer exactly once")
          live_path.write_text(live_text.replace(old, new), encoding="utf-8")

          test_path = Path("tests/test_trading_shorthand_normalization.py")
          test_path.write_text(
              '''from __future__ import annotations

          import ast
          import json
          import re
          from pathlib import Path

          import pytest

          ROOT = Path(__file__).resolve().parents[1]
          LIVE_BOT = ROOT / "live" / "live_bot.py"
          FEEDBACK = ROOT / "data" / "feedback" / "mistakes_labeled.jsonl"


          def load_normalizer():
              tree = ast.parse(LIVE_BOT.read_text(encoding="utf-8"))
              function = next(
                  node
                  for node in tree.body
                  if isinstance(node, ast.FunctionDef)
                  and node.name == "normalize_trading_shorthand"
              )
              module = ast.Module(body=[function], type_ignores=[])
              ast.fix_missing_locations(module)
              namespace = {"re": re}
              exec(compile(module, str(LIVE_BOT), "exec"), namespace)
              return namespace["normalize_trading_shorthand"]


          @pytest.mark.parametrize(
              ("prefix", "canonical"),
              [
                  ("물", "물 ㅂㅈ"),
                  ("롱", "롱 ㅂㅈ"),
                  ("숏", "숏 ㅂㅈ"),
                  ("반익", "반익 ㅂㅈ"),
                  ("익자유", "익자유 ㅂㅈ"),
                  ("익절", "익절 ㅂㅈ"),
              ],
          )
          def test_shorthand_whitespace_variants_normalize(prefix: str, canonical: str) -> None:
              normalize = load_normalizer()
              variants = [
                  f"{prefix}ㅂㅈ",
                  f"{prefix} ㅂㅈ",
                  f"{prefix}  ㅂ ㅈ",
                  f"{prefix}\tㅂ\nㅈ",
                  f"  {prefix} ㅂㅈ  ",
              ]
              for variant in variants:
                  assert normalize(variant) == canonical


          def test_normalizer_does_not_rewrite_natural_language_or_typos() -> None:
              normalize = load_normalizer()
              natural = "오늘은 익자유 ㅂㅈ 아니고 조금 더 볼게요"
              typo = "익자유 ㅂㅈㅈ"
              assert normalize(natural) == natural
              assert normalize(typo) == typo


          def test_pr52_training_rows_are_removed_but_original_compact_add_remains() -> None:
              messages = {
                  json.loads(line)["source"]["message"]
                  for line in FEEDBACK.read_text(encoding="utf-8").splitlines()
              }
              removed = {
                  "물 ㅂㅈ",
                  "롱 ㅂㅈ",
                  "롱ㅂㅈ",
                  "숏 ㅂㅈ",
                  "숏ㅂㅈ",
                  "반익 ㅂㅈ",
                  "반익ㅂㅈ",
                  "익자유 ㅂㅈ",
                  "익자유ㅂㅈ",
                  "익절 ㅂㅈ",
                  "익절ㅂㅈ",
              }
              assert messages.isdisjoint(removed)
              assert "물ㅂㅈ" in messages
          ''',
              encoding="utf-8",
          )

          Path(".github/workflows/temp-revert-pr52-normalize.yml").unlink()
          PY

      - name: Validate changes
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --quiet -r requirements-ci.txt
          python scripts/validate_dataset.py --root .
          python -m pytest -q

      - name: Commit branch changes
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/feedback/mistakes_labeled.jsonl live/live_bot.py tests/test_trading_shorthand_normalization.py .github/workflows/temp-revert-pr52-normalize.yml
          git commit -m "Revert shorthand feedback rows and normalize runtime input"
          git push origin HEAD:fix/revert-pr52-and-normalize-shorthand
