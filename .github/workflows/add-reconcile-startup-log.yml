name: Add reconcile startup log

on:
  push:
    branches:
      - fix/reconcile-interval-3s

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/reconcile-interval-3s

      - name: Add startup log
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("live/live_bot.py")
          text = path.read_text(encoding="utf-8")
          old = '        print(f"State: {STATE_PATH}")\n'
          new = (
              '        print(f"State: {STATE_PATH}")\n'
              '        print(f"Reconcile interval: {RECONCILE_INTERVAL_SECONDS:g}s")\n'
          )
          if text.count(old) != 1:
              raise SystemExit(f"expected exactly one target line, found {text.count(old)}")
          path.write_text(text.replace(old, new), encoding="utf-8")
          PY

      - name: Validate syntax
        run: python -m py_compile live/live_bot.py

      - name: Commit change and remove temporary workflow
        run: |
          rm .github/workflows/add-reconcile-startup-log.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add live/live_bot.py .github/workflows/add-reconcile-startup-log.yml
          git commit -m "Log reconcile interval at startup"
          git push origin HEAD:fix/reconcile-interval-3s
